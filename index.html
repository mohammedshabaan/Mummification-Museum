<!doctype html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>استخراج دعوة رسمية | العيد القومي للأقصر - متحف التحنيط</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400;1,700&family=Aref+Ruqaa:wght@400;700&family=Cairo:wght@400;600;700;800;900&family=Noto+Sans+Egyptian+Hieroglyphs&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold-light: #f5e2a3;
            --gold: #cfa847;
            --gold-dark: #9e7922;
            --gold-rich: #b38528;
            --obsidian: #0e131d;
            --obsidian-card: #151c28;
            --obsidian-border: #2c384d;
            --cream: #fbf8f1;
            --sand: #e6dac1;
            --shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: 'Cairo', Tahoma, Arial, sans-serif;
            background: radial-gradient(ellipse at top, #1a2334 0%, #0c1017 100%);
            color: #e8ecf4;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            position: relative;
            overflow-x: hidden;
        }

        /* Pharaonic background pattern */
        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: 
                radial-gradient(circle at 50% 20%, rgba(207, 168, 71, 0.08) 0%, transparent 60%),
                radial-gradient(circle at 80% 80%, rgba(179, 133, 40, 0.05) 0%, transparent 40%);
            pointer-events: none;
        }

        .main-container {
            width: 100%;
            max-width: 680px;
            background: var(--obsidian-card);
            border: 1px solid rgba(207, 168, 71, 0.35);
            border-radius: 16px;
            padding: clamp(24px, 5vw, 44px);
            box-shadow: var(--shadow), 0 0 40px rgba(207, 168, 71, 0.08);
            position: relative;
            backdrop-filter: blur(8px);
            z-index: 1;
        }

        /* Gold corner accents */
        .corner {
            position: absolute;
            width: 24px;
            height: 24px;
            border-color: var(--gold);
            pointer-events: none;
        }
        .corner-tl { top: 12px; right: 12px; border-top: 2px solid var(--gold); border-right: 2px solid var(--gold); }
        .corner-tr { top: 12px; left: 12px; border-top: 2px solid var(--gold); border-left: 2px solid var(--gold); }
        .corner-bl { bottom: 12px; right: 12px; border-bottom: 2px solid var(--gold); border-right: 2px solid var(--gold); }
        .corner-br { bottom: 12px; left: 12px; border-bottom: 2px solid var(--gold); border-left: 2px solid var(--gold); }

        .logos-strip {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-bottom: 24px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(207, 168, 71, 0.2);
        }

        .logo-box {
            background: #ffffff;
            border-radius: 50%;
            width: 62px;
            height: 62px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            border: 2px solid var(--gold);
            padding: 6px;
            transition: transform 0.3s ease;
        }

        .logo-box:hover {
            transform: translateY(-3px) scale(1.05);
        }

        .logo-box img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .hieroglyph-bar {
            text-align: center;
            color: var(--gold);
            font-size: 22px;
            letter-spacing: 8px;
            margin-bottom: 12px;
            text-shadow: 0 0 10px rgba(207, 168, 71, 0.5);
            font-family: 'Noto Sans Egyptian Hieroglyphs', sans-serif;
        }

        .eyebrow {
            text-align: center;
            color: var(--gold-light);
            font-size: 14px;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 700;
        }

        .title {
            text-align: center;
            font-family: 'Aref Ruqaa', 'Amiri', serif;
            font-size: clamp(28px, 6vw, 40px);
            color: #ffffff;
            margin: 8px 0 10px;
            line-height: 1.4;
            background: linear-gradient(135deg, #fff 40%, var(--gold-light) 75%, var(--gold) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            text-align: center;
            font-size: 15px;
            line-height: 1.8;
            color: #b5c0d0;
            margin: 0 auto 26px;
            max-width: 480px;
        }

        /* Title picker chips */
        .title-chips-label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--gold-light);
            margin-bottom: 8px;
        }

        .chips-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 16px;
        }

        .chip {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(207, 168, 71, 0.25);
            color: #d1d9e6;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .chip:hover, .chip.active {
            background: linear-gradient(135deg, var(--gold-dark), var(--gold));
            color: #0c1017;
            font-weight: 700;
            border-color: var(--gold-light);
            box-shadow: 0 2px 10px rgba(207, 168, 71, 0.3);
        }

        /* Input field */
        .input-group {
            margin-bottom: 22px;
        }

        .input-label {
            display: block;
            font-size: 14px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
        }

        input {
            width: 100%;
            padding: 16px 20px;
            background: #0b0f16;
            border: 1.5px solid rgba(207, 168, 71, 0.4);
            border-radius: 10px;
            font-family: 'Amiri', 'Cairo', serif;
            font-size: 19px;
            font-weight: 700;
            color: #ffffff;
            outline: none;
            transition: all 0.3s ease;
        }

        input:focus {
            border-color: var(--gold-light);
            box-shadow: 0 0 16px rgba(207, 168, 71, 0.35);
            background: #101621;
        }

        input::placeholder {
            color: #556276;
            font-family: 'Cairo', sans-serif;
            font-size: 15px;
            font-weight: 400;
        }

        /* Live Preview Card */
        .preview-box {
            background: rgba(207, 168, 71, 0.05);
            border: 1px dashed rgba(207, 168, 71, 0.4);
            border-radius: 10px;
            padding: 14px 18px;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .preview-label {
            font-size: 12px;
            color: var(--gold);
            font-weight: 600;
        }

        .preview-name {
            font-family: 'Amiri', serif;
            font-size: 20px;
            font-weight: 700;
            color: var(--gold-light);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* Submit Button */
        button[type="submit"] {
            width: 100%;
            padding: 17px;
            background: linear-gradient(135deg, #d8b24f 0%, #aa7e1e 50%, #d8b24f 100%);
            background-size: 200% auto;
            color: #0c1017;
            font-family: 'Cairo', sans-serif;
            font-size: 18px;
            font-weight: 800;
            border: 0;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(207, 168, 71, 0.35);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        button[type="submit"]:hover {
            background-position: right center;
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(207, 168, 71, 0.5);
        }

        button[type="submit"]:active {
            transform: translateY(0);
        }

        .note {
            text-align: center;
            font-size: 12px;
            color: #717d91;
            margin-top: 20px;
            line-height: 1.6;
        }

        .gold-star {
            color: var(--gold);
            margin: 0 4px;
        }
    </style>
</head>

<body>
    <main class="main-container">
        <!-- Corner Ornaments -->
        <div class="corner corner-tl"></div>
        <div class="corner corner-tr"></div>
        <div class="corner corner-bl"></div>
        <div class="corner corner-br"></div>

        <!-- Logos Header -->
        <div class="logos-strip">
            <div class="logo-box" title="وزارة السياحة والآثار">
                <img src="assets/ministry-logo.jpeg" alt="وزارة السياحة والآثار">
            </div>
            <div class="logo-box" title="متحف التحنيط بالأقصر">
                <img src="assets/mummification-museum.jpeg" alt="متحف التحنيط بالأقصر">
            </div>
            <div class="logo-box" title="قطاع المتاحف">
                <img src="assets/33.jpeg" alt="قطاع المتاحف">
            </div>
        </div>

        <div class="hieroglyph-bar">𓂀 𓋹 𓆣 𓏏 𓊹</div>
        <div class="eyebrow">متحف التحنيط بالأقصر</div>
        <h1 class="title">استخراج دعوة رسمية</h1>
        <p class="subtitle">
            احتفالية العيد القومي لمحافظة الأقصر<br>
            يُرجى إدخال اسم المدعو الكريم لتوليد بطاقة الدعوة الملكية
        </p>

        <form id="inviteForm">
            <!-- Title Selector Chips -->
            <label class="title-chips-label">اللقب الشرفي (اختياري)</label>
            <div class="chips-container" id="chipsContainer">
                <button type="button" class="chip" data-title="معالي">معالي</button>
                <button type="button" class="chip" data-title="سعادة">سعادة</button>
                <button type="button" class="chip" data-title="الأستاذ الدكتور">الأستاذ الدكتور</button>
                <button type="button" class="chip" data-title="المستشار">المستشار</button>
                <button type="button" class="chip" data-title="المهندس">المهندس</button>
                <button type="button" class="chip" data-title="الأستاذ">الأستاذ</button>
                <button type="button" class="chip" data-title="الأستاذة">الأستاذة</button>
            </div>

            <!-- Name Input -->
            <div class="input-group">
                <label for="guestName" class="input-label">اسم المدعو بالكامل</label>
                <div class="input-wrapper">
                    <input id="guestName" type="text" maxlength="80" required
                           placeholder="مثال: أحمد محمد علي" autocomplete="name">
                </div>
            </div>

            <!-- Live Preview -->
            <div class="preview-box">
                <span class="preview-label">معاينة ظهور الاسم:</span>
                <span class="preview-name" id="previewText">اسم المدعو الكريم</span>
            </div>

            <!-- Action Button -->
            <button type="submit">
                <span>عرض وتحميل الدعوة الملكية</span>
                <span>⟵</span>
            </button>
        </form>

        <p class="note">
            <span class="gold-star">✦</span> يتم تجهيز الدعوة فائقة الدقة (Ultra HD) مباشرة على جهازك دون إرسال بياناتك لأي خادم خارجي.
        </p>
    </main>

    <script>
        const input = document.getElementById('guestName');
        const preview = document.getElementById('previewText');
        const chips = document.querySelectorAll('.chip');
        let selectedTitle = '';

        // Chips click handler
        chips.forEach(chip => {
            chip.addEventListener('click', () => {
                const title = chip.getAttribute('data-title');
                if (selectedTitle === title) {
                    selectedTitle = '';
                    chip.classList.remove('active');
                } else {
                    chips.forEach(c => c.classList.remove('active'));
                    selectedTitle = title;
                    chip.classList.add('active');
                }
                updatePreview();
            });
        });

        // Live input update
        input.addEventListener('input', updatePreview);

        function updatePreview() {
            const val = input.value.trim();
            if (!val && !selectedTitle) {
                preview.textContent = 'اسم المدعو الكريم';
            } else {
                preview.textContent = [selectedTitle, val].filter(Boolean).join(' ');
            }
        }

        // Form submit
        document.getElementById('inviteForm').addEventListener('submit', function (e) {
            e.preventDefault();
            const rawName = input.value.trim();
            if (!rawName) return;
            const fullName = selectedTitle ? `${selectedTitle} / ${rawName}` : rawName;
            location.href = 'invitation.html?name=' + encodeURIComponent(fullName);
        });
    </script>
</body>

</html>
